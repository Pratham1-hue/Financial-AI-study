name: keep-alive

# Render's FREE web services sleep after 15 minutes without HTTP traffic.
# The Starter plan in render.yaml does not sleep - if you are paying, disable this workflow.
#
# Setup: Settings -> Secrets and variables -> Actions -> Variables -> New variable
#   Name:  DEVI_URL
#   Value: https://your-app.onrender.com
#
# The health endpoint is served by Streamlit itself, so it needs no password and does
# not start a session or touch your progress file.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes; Render sleeps at 15
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /_stcore/health
        env:
          DEVI_URL: ${{ vars.DEVI_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEVI_URL:-}" ]; then
            echo "DEVI_URL repository variable is not set." >&2
            exit 1
          fi
          target="${DEVI_URL%/}/_stcore/health"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$target")
          echo "$target -> $code"
          test "$code" = "200"
