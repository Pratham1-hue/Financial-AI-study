services:
  - type: web
    name: project-devi
    runtime: docker
    plan: free             # sleeps after 15 idle minutes; no persistent disk (see DEPLOY.md)
    region: ohio
    numInstances: 1        # JSON storage is single-writer; never scale past one
    healthCheckPath: /_stcore/health
    autoDeploy: false       # on free tier a deploy wipes progress: export first, then deploy
    envVars:
      - key: DEVI_PASSWORD
        sync: false         # set in the Render dashboard; never commit it
      - key: DEVI_SECRET
        sync: false         # optional extra pepper for the session cookie
      - key: DEVI_COOKIE_SECURE
        value: "1"          # Render terminates TLS, so the cookie is HTTPS-only
      - key: YOUTUBE_API_KEY
        sync: false
